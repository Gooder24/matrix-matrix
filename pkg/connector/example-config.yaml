# Name of the device the bridge adds to each account it signs in to.
device_name: Matrix bridge
# Where each login's encryption keys and sync state are kept, one SQLite file per login and device.
# Signing out deletes the file; never restore an old one (old Olm/Megolm state breaks encryption).
crypto_dir: crypto
# Files larger than this do not cross, in either direction (a note says so).
max_file_size: 26214400
# Rooms with up to this many people get all their members at once; in bigger ones people appear as they write.
members_at_once: 20
# Homeservers, as signed in to (https://example.org or http://127.0.0.1:8448), where the account accepts every
# invitation. Only for a server that itself lets in only the people you chose (a federation allowlist, as Weft
# Priamo's); elsewhere invitations are never accepted, so a stranger cannot pull the account into a room.
accept_invites_on: []
